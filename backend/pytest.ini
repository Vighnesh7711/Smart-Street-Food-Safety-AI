[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
markers =
    db: requires a reachable PostgreSQL database (skipped automatically if unavailable)
    integration: exercises the scan pipeline end to end with mocked providers
    translation_model: loads the real IndicTrans2 weights (~1.1 GB, seconds per
        inference). Opt in with RUN_TRANSLATION_MODEL_TESTS=1; skipped otherwise
        so the default suite stays fast, offline and model-free.
filterwarnings =
    ignore::DeprecationWarning:passlib.*
